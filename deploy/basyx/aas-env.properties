# Eclipse BaSyx AAS Environment (AAS + Submodel + ConceptDescription repositories)
# Secrets (MongoDB credentials, MQTT password) come from environment variables.
server.port=8081

basyx.backend=MongoDB
spring.mongodb.host=mongo
spring.mongodb.database=aas-env
spring.mongodb.authentication-database=admin
spring.data.mongodb.host=mongo
spring.data.mongodb.database=aas-env
spring.data.mongodb.authentication-database=admin

# Repository events -> broker (internal listener, user "basyx", see deploy/mosquitto/acl)
mqtt.clientId=basyx-aas-env
mqtt.hostname=mosquitto
mqtt.port=1883
mqtt.username=basyx
basyx.aasrepository.feature.mqtt.enabled=true
basyx.submodelrepository.feature.mqtt.enabled=true

# Browser access from the Connect Forge app ("Push to BaSyx"); restrict origins via BASYX_CORS_ALLOWED_ORIGINS
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

basyx.aasrepository.feature.registryintegration=http://aas-registry:8080
basyx.submodelrepository.feature.registryintegration=http://sm-registry:8080
