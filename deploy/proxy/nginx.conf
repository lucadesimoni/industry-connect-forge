# HTTPS + authentication in front of the BaSyx AAS Environment (ADR 0003).
# Only this proxy is reachable from the network; BaSyx itself is bound to
# 127.0.0.1 on the host (deploy/docker-compose.yml).
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  # AAS / AASX payloads with attachments
  client_max_body_size 50m;

  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      # CORS preflight requests carry no credentials (Fetch standard) and are
      # answered by BaSyx itself; every other method requires a login.
      limit_except OPTIONS {
        auth_basic           "Connect Forge BaSyx";
        auth_basic_user_file /etc/nginx/htpasswd;
      }
      proxy_pass http://aas-env:8081;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      # credentials are checked here and not passed on to BaSyx
      proxy_set_header Authorization     "";
    }
  }
}
