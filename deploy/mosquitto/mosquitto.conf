# Eclipse Mosquitto 2.x – UNS / Sparkplug B / AAS-safe broker
# Tested by scripts/test-broker.sh and scripts/test-stack.sh (see docs/MQTT_BROKER_CONFIGURATION.md)
per_listener_settings false
allow_anonymous false

listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
# certificate CN = MQTT username (used by the ACL file)
use_identity_as_username true

acl_file /mosquitto/config/acl
# username/password for clients without certificate identity (internal listener);
# not used on the TLS listener, where the certificate CN is the username
password_file /mosquitto/config/passwd

# Internal listener for services on the same Docker network (BaSyx event
# publishing). Not published to the host in deploy/docker-compose.yml.
listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/
retain_available true
max_packet_size 1048576
max_keepalive 120
max_queued_messages 10000

log_type error
log_type warning
log_type notice
